name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Format check (Prettier)
        run: bun run format:check

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
